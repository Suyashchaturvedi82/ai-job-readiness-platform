# Load the repo-root .env (IntelliJ runs from the repo root; mvnw from the module dir).
# Docker has no .env in the container — GEMINI_API_KEY/JWT_SECRET come from compose env instead.
spring.config.import=optional:file:${user.dir}/.env[.properties],optional:file:${user.dir}/../.env[.properties],optional:file:${user.dir}/../../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/job_readiness_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

jwt.secret=d30b26c4cc3bbd02a86f8407924e90e927bddcb9dbef05a9109ef5d2fc5eddef60fd0d815d74bbfb2192f5cc22a50ce72c088c053b577c1b9e0179b91d3bcaf4
jwt.expiration-ms=86400000

# Valid key lives in .env (GEMINI_API_KEY) or the container env — never hardcode it here again.
gemini.api-key=${GEMINI_API_KEY:}

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

gemini.models=gemini-3.5-flash,gemini-3.5-flash-lite
