version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jrp-postgres
    environment:
      POSTGRES_DB: job_readiness_db
      POSTGRES_USER: jrp_user
      POSTGRES_PASSWORD: jrp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jrp-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: