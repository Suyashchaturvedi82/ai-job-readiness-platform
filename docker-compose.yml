version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jrp-postgres
    environment:
      POSTGRES_DB: job_readiness_db
      POSTGRES_USER: jrp_user
      POSTGRES_PASSWORD: jrp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jrp-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend/job-readiness-platform
    container_name: jrp-backend
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_readiness_db
      SPRING_DATASOURCE_USERNAME: jrp_user
      SPRING_DATASOURCE_PASSWORD: jrp_password
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: jrp-frontend
    ports:
      - "5173:80"

volumes:
  postgres_data: